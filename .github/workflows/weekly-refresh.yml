# Tuesday: new nflverse week -> features -> re-train live model -> report, card, tweet draft -> push (Vercel deploys).
# Retries until nflverse has published Monday night's game; later runs no-op once the week is reported.
name: Weekly refresh
on:
  schedule:
    - cron: "0 11 * * 2"   # 5am CT (6am CDT)
    - cron: "0 14 * * 2"
    - cron: "0 16 * * 2"
  workflow_dispatch:
    inputs:
      week: { description: "Week to report (blank = latest in the data)", required: false }
      force: { description: "Re-run a week that's already reported", type: boolean, default: false }
      nodeploy: { description: "Dry run: build everything, don't commit or push", type: boolean, default: false }
permissions: { contents: write }
concurrency: { group: weekly, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4   # past seasons' nflverse files never change mid-season
        with:
          path: data/raw
          key: nflverse-raw-${{ github.run_id }}
          restore-keys: nflverse-raw-
      - name: Refresh
        env:
          PY: python
          THREADS: "4"
          WEEK: ${{ inputs.week }}
          FORCE: ${{ inputs.force && '1' || '' }}
          NODEPLOY: ${{ inputs.nodeploy && '1' || '' }}
        run: |
          # commits must carry Kyle's identity: Vercel Hobby only deploys commits by the account owner
          git config user.name "Kyle Dixon"
          git config user.email "kyleleedixon@gmail.com"
          ./weekly.sh
