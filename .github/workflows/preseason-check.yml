# Between seasons, nothing here needs a person.
# Monthly March-August:
# - season close (season_close.sh): save the finished season's predictions, run the full model once nflverse publishes
#   its participation data, refresh the players table. Idempotent; no-ops once done. Then a heartbeat commit, so GitHub
#   never disables the schedules over a quiet off-season (it does after 60 days without commits in a public repo).
# August 1 and September 15:
# - research every team's head coach and play-caller (src/check_coaches.py audit: Claude + web search, sourced) into
#   src/headcoaches.csv / src/playcallers.csv; in season, coach-check.yml looks for changes weekly
# - check every team's hashtag against its own recent X posts (src/check_hashtags.py) and commit any change.
# August 1:
# - re-download team logos (src/fetch_logos.py: nflverse team table -> ESPN) and commit them if any changed.
# The new season itself needs no step: src/season.py rolls the pipeline over in September.
# Commits carry Kyle's identity: Vercel Hobby only deploys commits by the account owner.
name: Preseason check
on:
  schedule:
    - cron: "0 15 1 3-8 *"
    - cron: "0 15 15 9 *"
  workflow_dispatch:
permissions: { contents: write, issues: write }
concurrency: { group: refresh, cancel-in-progress: false }   # never alongside a refresh (both push)
jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      month: ${{ steps.m.outputs.month }}
    steps:
      - id: m
        run: echo "month=$(date -u +%m)" >> "$GITHUB_OUTPUT"
  season-close:
    needs: when
    if: github.event_name == 'workflow_dispatch' || (needs.when.outputs.month >= '03' && needs.when.outputs.month <= '08')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with: { path: data/raw, key: nflverse-raw-none, restore-keys: nflverse-raw- }
      - name: Season close
        env: { PY: python, THREADS: "4" }
        run: |
          git config user.name "Kyle Dixon"
          git config user.email "kyleleedixon@gmail.com"
          ./season_close.sh
      - name: Heartbeat
        # GitHub disables a public repo's schedules after 60 days without commits; off-season months can be that quiet
        run: |
          date -u +%F > state/heartbeat
          git add state/heartbeat
          git diff --cached --quiet && exit 0
          git commit -q -m "Off-season heartbeat [skip ci]"
          git pull -q --rebase origin main
          git push origin main
  august:
    needs: [when, season-close]   # one push at a time
    if: always() && (github.event_name == 'workflow_dispatch' || needs.when.outputs.month == '08' || needs.when.outputs.month == '09')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pandas==2.3.3 requests==2.34.2 pillow==13.0.0 requests-oauthlib==2.0.0 anthropic==2.3.0
      - name: Coaches and play-callers (all 32 teams, researched with Claude + web search)
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: python src/check_coaches.py audit
      - name: Hashtags
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python src/check_hashtags.py
      - name: Logos
        if: github.event_name == 'workflow_dispatch' || needs.when.outputs.month == '08'
        run: python src/fetch_logos.py
      - name: Commit changes
        run: |
          git add src/hashtags.json assets/logos site/logos src/headcoaches.csv src/playcallers.csv state/coach_check.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          echo "::notice::updated: $(git diff --cached --name-only | tr '\n' ' ')"
          git -c user.name="Kyle Dixon" -c user.email="kyleleedixon@gmail.com" commit -q -m "Preseason: coaches, play-callers, hashtags, logos"
          git pull -q --rebase origin main
          git push
